# redis-operator Helm values
# Chart: ot-helm/redis-operator
# Install: helm upgrade --install redis-operator ot-helm/redis-operator -f operator.yml -n redis-operator --create-namespace
#
# watchNamespaces limits the operator to reconcile CRs only in the listed namespaces.
# Leave empty ("") or omit to watch cluster-wide.

redisOperator:
  watchNamespace: "redis"
  metrics:
    enabled: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
