# Redis standalone CR — single-node, no replication
# Applied with: kubectl apply -f redis.yml -n redis
#
# Use this for dev / single-node environments.
# For HA (1 master + 2 replicas), use redis-replication.yml instead.
#
# Requires: redis-operator installed in redis-operator namespace

apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: redis
data:
  redis-additional.conf: |
    maxmemory 1536mb
    maxmemory-policy noeviction
    appendonly no
    save ""
    io-threads 2
    tcp-backlog 4096
    tcp-keepalive 60
    timeout 0

---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: redis
  namespace: redis
spec:
  kubernetesConfig:
    image: quay.io/opstree/redis:v8.6.1
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 2
        memory: 2Gi
      limits:
        cpu: 2
        memory: 2Gi

  redisConfig:
    additionalRedisConfig: redis-config

  redisExporter:
    enabled: true
    image: quay.io/opstree/redis-exporter:v1.83.0
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 64Mi

  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 5

  readinessProbe:
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: redis-external
  namespace: redis
spec:
  type: NodePort
  selector:
    app: redis
    redis_setup_type: standalone
  ports:
    - port: 6379
      targetPort: 6379
      nodePort: 30379
