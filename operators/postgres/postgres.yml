# CloudNativePG single-instance Cluster CR (dev)
# Applied with: kubectl apply -f postgres.yml -n postgres
#
# 1 instance = primary only, no standbys. For HA (1 primary + 2 standbys), use postgres-ha.yml.
#
# Requires:
#   - cnpg operator installed in cnpg-system namespace
#   - Secret "postgres-app-password" with key "password" in the postgres namespace

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: postgres
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18

  bootstrap:
    initdb:
      database: postgres
      owner: pg-admin
      secret:
        name: postgres-app-password

  storage:
    storageClass: local-path
    size: 30Gi

  resources:
    requests:
      cpu: 2
      memory: 5Gi
    limits:
      cpu: 2
      memory: 5Gi

  managed:
    roles:
      - name: pg-admin
        superuser: true
        login: true
        passwordSecret:
          name: postgres-app-password

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "1280MB"
      effective_cache_size: "3584MB"
      work_mem: "16MB"
      maintenance_work_mem: "256MB"
      max_worker_processes: "4"
      max_parallel_workers: "2"
      max_parallel_workers_per_gather: "1"
      wal_buffers: "16MB"
      max_wal_size: "4GB"
      min_wal_size: "1GB"
      checkpoint_completion_target: "0.9"
      wal_compression: "lz4"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: "all"

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-external
  namespace: postgres
spec:
  type: NodePort
  selector:
    cnpg.io/cluster: postgres
    cnpg.io/instanceRole: primary
  ports:
    - port: 5432
      targetPort: 5432
      nodePort: 30432
      protocol: TCP
